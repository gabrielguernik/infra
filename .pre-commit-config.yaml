# The same static checks as CI (terraform-pr.yml): fmt, validate, tflint, Trivy (HIGH/CRITICAL, .trivyignore.yaml).
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 521ada54e82bdee23c6a1f42a83cd22898f1efd4 # frozen: v1.99.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: ["--hook-config=--retry-once-with-cleanup=true"]
      - id: terraform_tflint
        args: ["--args=--config=__GIT_WORKING_DIR__/.tflint.hcl", "--args=--minimum-failure-severity=warning"]
  # Trivy runs once from the repo root, like CI: .trivyignore.yaml matches paths from the root, which the
  # per-directory terraform_trivy hook can't do. Needs trivy installed.
  - repo: local
    hooks:
      - id: trivy-config
        name: Trivy config scan
        language: system
        pass_filenames: false
        entry: trivy config --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml --skip-files '**/tfplan' --exit-code 1 --quiet .
